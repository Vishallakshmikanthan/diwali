<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Soft Glow -->
  <circle cx="32" cy="24" r="18" fill="url(#glowGrad)" opacity="0.6"/>
  <!-- Diya Base Lamp -->
