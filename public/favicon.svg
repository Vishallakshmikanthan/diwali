  <ellipse cx="32" cy="35" rx="20" ry="4" fill="url(#oilGrad)"/>
  <path d="M26 47 L38 47 L41 52 L23 52 Z" fill="url(#baseGrad)"/>
  <!-- Diya Flame -->
  <path d="M32 8 C35 15 39 21 38 28 C37 33 27 33 26 28 C25 21 29 15 32 8 Z" fill="url(#flameGrad)"/>
  <!-- Inner Flame Core -->
  <path d="M32 16 C34 20 36 24 35 29 C34 32 30 32 29 29 C28 24 30 20 32 16 Z" fill="#ffffff" opacity="0.9"/>

  <defs>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brassGrad" x1="12" y1="36" x2="52" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="23" y1="47" x2="41" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="oilGrad" x1="12" y1="35" x2="52" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="32" y1="8" x2="32" y2="33" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
